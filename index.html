    <!-- ==========================================================
         SCROLL ENGINE + SHARED LAYOUT WATCHER
         Deliberately a plain inline script rather than part of the
         bundle, for three reasons:

         1. history.scrollRestoration has to be set before the browser
            makes its own restore attempt, which happens before a
            module script has finished executing.
         2. The document has NO scrollable height until React mounts
            (the boot shell is position:fixed), so a saved offset
            cannot be applied then. The engine keeps retrying as the
            page grows, since webfonts and images land after paint.
         3. The abort listeners must be live during that whole window,
            so a reader who starts scrolling is never yanked later.

         Position is kept in history.state, which survives a reload and
         is not localStorage/sessionStorage.
         ========================================================== -->
    <script>
        (function () {
            'use strict';
            try {
                /* ---- one ResizeObserver, shared with the reveal system ---- */
                var watchers = new Set();
                var observer = null;
                window.__layout = {
                    watch: function (fn) {
                        watchers.add(fn);
                        if (!observer && typeof ResizeObserver !== 'undefined') {
                            observer = new ResizeObserver(function () {
                                watchers.forEach(function (w) { w(); });
                            });
                            observer.observe(document.documentElement);
                        }
                        return function () { watchers.delete(fn); };
                    },
                    notify: function () { watchers.forEach(function (w) { w(); }); }
                };

                var BUDGET_MS = 8000, CEILING_MS = 25000, QUIET_MS = 400, TOL_PX = 2;
                var state = 'idle', pending = 0, appliedOnce = false;
                var budget = BUDGET_MS;   // per-run; never overwrite the constant
                var deadline = 0, ceiling = 0, lastGrowth = 0, lastHeight = 0;
                var unwatch = null, settleTimer = 0, timers = [];
                var lastWritten = -1, writeTimer = 0, writeScheduled = false;

                function docHeight() {
                    return Math.max(
                        document.documentElement.scrollHeight,
                        document.body ? document.body.scrollHeight : 0
                    );
                }
                function scrollMax() { return docHeight() - window.innerHeight; }

                /* ---- reading position, out of the current history entry ---- */
                if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
                if (!history.state) {
                    history.replaceState({ scrollY: 0, path: location.pathname }, '');
                }
                var saved = history.state;
                if (saved && typeof saved.scrollY === 'number' && saved.scrollY > 0 &&
                    (!saved.path || saved.path === location.pathname)) {
                    pending = saved.scrollY;
                }

                /* ---- user intent cancels the restore ---- */
                var SCROLL_KEYS = {
                    PageUp: 1, PageDown: 1, Home: 1, End: 1,
                    ArrowUp: 1, ArrowDown: 1, ' ': 1, Spacebar: 1
                };
                function isField(el) {
                    if (!el || !el.tagName) return false;
                    return el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' ||
                        el.tagName === 'SELECT' || el.isContentEditable;
                }
                function onIntent(event) {
                    if (state !== 'restoring') return;
                    if (event && event.type === 'keydown') {
                        if (!SCROLL_KEYS[event.key]) return;
                        if (isField(event.target)) return;
                    }
                    // While the page cannot move, a gesture cannot express a
                    // reading position. Aborting here would strand the reader
                    // at the top, which is the bug this exists to fix.
                    if (!appliedOnce && scrollMax() <= 0) return;
                    stop('aborted');
                }

                function teardown() {
                    if (unwatch) { unwatch(); unwatch = null; }
                    clearTimeout(settleTimer);
                    settleTimer = 0;
                    timers.forEach(clearTimeout);
                    timers = [];
                    window.removeEventListener('load', attempt);
                    document.removeEventListener('visibilitychange', onVisible);
                    window.removeEventListener('wheel', onIntent, true);
                    window.removeEventListener('touchmove', onIntent, true);
                    window.removeEventListener('keydown', onIntent, true);
                }
                function stop(next) {
                    if (state !== 'restoring') return;
                    state = next;
                    teardown();
                }
                function onVisible() { if (!document.hidden) attempt(); }

                function attempt() {
                    if (state !== 'restoring') return;
                    var t = performance.now();
                    var h = docHeight();
                    if (h !== lastHeight) { lastHeight = h; lastGrowth = t; }

                    var max = h - window.innerHeight;
                    if (max > 0) {
                        // The settling budget starts here, not at page parse.
                        // Until the document is scrollable nothing can happen,
                        // and on a slow device React can take longer to mount
                        // than the whole budget — which used to expire against
                        // an empty page and give up before the content existed.
                        if (deadline === 0) deadline = t + budget;

                        var desired = Math.min(pending, max);
                        if (Math.abs(window.scrollY - desired) > TOL_PX) {
                            window.scrollTo(0, desired);
                            appliedOnce = true;
                            // Let the reveals re-measure at the new offset now,
                            // instead of sitting invisible until their timers.
                            window.__layout.notify();
                        }
                        // Settled means: on the real target AND the document has
                        // stopped growing. Stopping the moment we hit the number
                        // would declare victory on a clamp.
                        if (max >= pending && t - lastGrowth > QUIET_MS) return stop('done');
                        if (t > deadline) return stop('done');

                        // Re-check once the page has been quiet, rather than
                        // polling every frame.
                        clearTimeout(settleTimer);
                        settleTimer = setTimeout(attempt, QUIET_MS + 20);
                    }
                    // Hard ceiling so a page that never becomes scrollable, or a
                    // hidden tab, cannot leave this running forever.
                    if (t > ceiling) return stop('done');
                }

                function begin(target, runBudget) {
                    var now = performance.now();
                    pending = target;
                    state = 'restoring';
                    appliedOnce = false;
                    budget = runBudget || BUDGET_MS;
                    deadline = 0;                       // armed once the page can scroll
                    ceiling = now + CEILING_MS;
                    lastHeight = docHeight();
                    lastGrowth = now;

                    unwatch = window.__layout.watch(attempt);
                    window.addEventListener('load', attempt);
                    document.addEventListener('visibilitychange', onVisible);
                    window.addEventListener('wheel', onIntent, { passive: true, capture: true });
                    window.addEventListener('touchmove', onIntent, { passive: true, capture: true });
                    window.addEventListener('keydown', onIntent, true);
                    if (document.fonts && document.fonts.ready) {
                        document.fonts.ready.then(attempt).catch(function () { });
                    }
                    // The ResizeObserver catches document growth precisely, so
                    // there is no polling loop here — an rAF chain that measured
                    // scrollHeight every frame forced a synchronous layout on
                    // each one and measurably slowed the JSX compile. These are
                    // the backstop for background tabs, where rAF and observers
                    // are throttled.
                    [0, 60, 150, 400, 1000, 2000, 4000, 7000, 11000, 16000, 22000].forEach(function (ms) {
                        timers.push(setTimeout(attempt, ms));
                    });
                    attempt();
                }

                /* ---- persistence ---- */
                function write(y) {
                    // Never persist our own clamped position mid-restore, or the
                    // target is overwritten with 0 and there is nothing to aim at.
                    if (state === 'restoring') return;
                    y = Math.round(y);
                    if (y === lastWritten) return;
                    lastWritten = y;
                    try {
                        var next = {};
                        var cur = history.state || {};
                        for (var k in cur) next[k] = cur[k];
                        next.scrollY = y;
                        next.path = location.pathname;
                        history.replaceState(next, '');
                    } catch (e) { /* rate limited; the next write catches up */ }
                }

                window.addEventListener('scroll', function () {
                    if (writeScheduled) return;
                    writeScheduled = true;
                    requestAnimationFrame(function () {
                        writeScheduled = false;
                        if (writeTimer) return;
                        write(window.scrollY);
                        writeTimer = setTimeout(function () {
                            writeTimer = 0;
                            write(window.scrollY);
                        }, 400);
                    });
                }, { passive: true });

                // The write that actually makes reload work.
                window.addEventListener('pagehide', function () { write(window.scrollY); });
                document.addEventListener('visibilitychange', function () {
                    if (document.visibilityState === 'hidden') write(window.scrollY);
                });
                // Coming back through the bfcache: the browser already restored.
                window.addEventListener('pageshow', function (event) {
                    if (event.persisted) stop('done');
                });

                window.__scroll = {
                    start: function () { if (state === 'restoring') attempt(); },
                    cancel: function () { stop('cancelled'); },
                    restoreTo: function (y, options) {
                        stop('cancelled');
                        if (!(y > 0)) { window.scrollTo(0, 0); return; }
                        begin(y, (options && options.budget) || 1500);
                    },
                    get state() { return state; },
                    get target() { return pending; }
                };

                if (pending > 0) begin(pending, BUDGET_MS);
                else state = 'done';
            } catch (e) {
                // Degrade to the previous behaviour rather than break the page.
                window.__layout = window.__layout || { watch: function () { return function () { }; }, notify: function () { } };
                window.__scroll = window.__scroll || {
                    start: function () { }, cancel: function () { },
                    restoreTo: function (y) { window.scrollTo(0, y || 0); },
                    get state() { return 'done'; }, get target() { return 0; }
                };
            }
        })();
    </script>

    <style>
        :root {
            --bg-color: #F4F4F2;
            --text-color: #1A1A1A;
            --border-color: #D4D4D0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
            /* The real pointer stays visible. The system cursor used to be
               hidden here, which left the custom ring as the only thing on
               screen — and the ring relied on blend modes, so over some
               backgrounds and inside blurred or clipped layers it vanished
               and took the pointer with it. The ring is now an accent on top
               of a cursor that is always there. */
        }

        @media (pointer: coarse) {
            .custom-cursor {
                display: none;
            }
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* ==========================================================
           BOOT SHELL
           The document used to ship an empty #root, so there was
           literally nothing for the browser to paint until React had
           downloaded, compiled and mounted. First contentful paint was
           never firing at all, and on a mid-range device that meant
           several seconds of blank white page: the visitor's reasonable
           conclusion is that the site is broken.

           So the chrome now ships as real markup inside #root and is
           styled here rather than by Tailwind, which is itself a runtime
           dependency. It paints on the first frame. React clears #root
           when it mounts and replaces this with the identical live
           chrome, so the swap is invisible.

           Kept deliberately small: only what is identical on every route.
           ========================================================== */
        .boot {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
        }

        .boot-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .boot-wordmark {
            font-weight: 700;
            letter-spacing: -0.02em;
            font-size: 1.125rem;
            color: var(--text-color);
        }

        .boot-burger {
            width: 22px;
            height: 2px;
            background: var(--text-color);
            box-shadow: 0 7px 0 var(--text-color), 0 -7px 0 var(--text-color);
        }

        .boot-side {
            display: none;
        }

        .boot-name {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }

        .boot-role {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            line-height: 1.6;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #737373;
        }

        .boot-nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 3rem;
        }

        .boot-nav span {
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.5rem 0;
        }

        @media (min-width: 1024px) {
            .boot-top {
                display: none;
            }

            .boot-side {
                display: block;
                width: 18rem;
                height: 100%;
                padding: 2rem;
                border-right: 1px solid var(--border-color);
            }
        }

        /* A quiet signal that work is happening, in the site's own ink. */
        .boot-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            overflow: hidden;
        }

        .boot-bar span {
            display: block;
            width: 40%;
            height: 100%;
            background: var(--text-color);
            animation: boot-slide 1.1s ease-in-out infinite;
        }

        @keyframes boot-slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }

        @media (prefers-reduced-motion: reduce) {
            .boot-bar span {
                animation: none;
                width: 100%;
                opacity: 0.25;
            }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: #CCC;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
        }

        .marquee-content {
            display: inline-block;
            animation: marquee 40s linear infinite;
        }

        @keyframes marquee {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        /* Mobile Menu Animation */
        .mobile-menu-enter {
            transform: translateY(-100%);
            opacity: 0;
        }

        .mobile-menu-enter-active {
            transform: translateY(0);
            opacity: 1;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .mobile-menu-exit {
            transform: translateY(0);
            opacity: 1;
        }

        .mobile-menu-exit-active {
            transform: translateY(-100%);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Custom cursor ring.
           No blend mode any more: `mix-blend-mode: difference` vanished
           against mid-tones, and it is dropped entirely inside elements that
           create their own stacking context — backdrop-blur bars, clipped
           and transformed containers, video. A dark ring with a light halo
           is legible on the light ground, the #111 sections and photography
           alike, with no guesswork.
           The centre dot is gone because the real pointer now sits there. */
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 22px;
            height: 22px;
            border: 1.5px solid rgba(17, 17, 17, 0.55);
            box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.65);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                height 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.2s ease;
            opacity: 0.85;
        }

        .custom-cursor.hovered {
            width: 46px;
            height: 46px;
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            .custom-cursor {
                transition: none;
            }
        }

        /* ==========================================================
           ABOUT — "Praise, Unfiltered"
           Everything here is namespaced to .story-* and only ever
           applied inside the About page. No global rules change.
           ========================================================== */

        /* The photographic treatment: the site's grayscale-to-colour
           signature, slowed to an editorial pace. */
        .story-frame {
            overflow: hidden;
            background-color: #EAEAE5;
        }

        .story-photo {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1);
            transition: filter 900ms cubic-bezier(0.16, 1, 0.3, 1),
                transform 900ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .story-plate:hover .story-photo {
            filter: grayscale(0);
            transform: scale(1.03);
        }

        /* Captions sit quietly under the frame and step forward on hover.
           They stay recessive through size, weight and tracking rather than
           low opacity, so they keep a readable contrast ratio. */
        .story-note {
            transition: color 500ms ease;
        }

        .story-plate:hover .story-note {
            color: #111;
        }

        /* Mask reveal for the chapter headlines. */
        .story-mask {
            overflow: hidden;
        }

        .story-mask>* {
            padding-bottom: 0.12em;
        }

        @media (prefers-reduced-motion: reduce) {

            .story-photo,
            .story-plate:hover .story-photo {
                transition: none;
                transform: none;
            }
        }

        /* ==========================================================
           TESTIMONIALS — home page
           The same grayscale-to-colour reveal the rest of the site
           uses. Deliberately NOT `.group`: these blocks aren't
           clickable, so they shouldn't put the cursor in its

        .quote-card .quote-avatar {

        }

        .quote-card:hover .quote-avatar {
            filter: grayscale(0);
            transform: scale(1.05);
        }

        @media (prefers-reduced-motion: reduce) {

            .quote-card .quote-avatar,
            .quote-card:hover .quote-avatar {
                transition: none;
                transform: none;
            }
        }

        /* Jump targets on the Ewave case study. The case study header is
           sticky, so without this the heading you land on sits underneath
           it. Offset clears the bar plus a little breathing room. */
        .study-anchor {
            scroll-margin-top: 5.5rem;
        }
